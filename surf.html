<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swell Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen&display=swap">
<style>
/* Layout: one fixed 320x180 pixel stage, scaled up, centered on a dusk ground; HUD and overlays sit inside the stage. */
:root{
  --ink:#120f26;      /* letterbox + text shadow */
  --dusk:#3a2a63;     /* panels */
  --peach:#f6a57a;    /* accent: sunset */
  --foam:#effff8;     /* main text */
  --sea:#1b7483;      /* secondary accent */
  --sun:#ffd36b;      /* score / highlights */
  --bad:#ff6f61;
  --fd:"Jersey 10","Courier New",monospace;
  --fu:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--fu);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:relative;--s:2;image-rendering:pixelated;box-shadow:0 0 0 calc(var(--s)*2px) #241c46,0 18px 50px rgba(0,0,0,.5)}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--s)*5px);text-shadow:calc(var(--s)*.5px) calc(var(--s)*.5px) 0 var(--ink)}
.tl{position:absolute;left:calc(var(--s)*5px);top:calc(var(--s)*4px)}
.tr{position:absolute;right:calc(var(--s)*5px);top:calc(var(--s)*4px);text-align:right}
.lbl{color:var(--peach);letter-spacing:.08em}
#score{font-family:var(--fd);font-size:calc(var(--s)*13px);line-height:.9;color:var(--sun);font-variant-numeric:tabular-nums}
#combo{margin-top:calc(var(--s)*1px)}
#combo b{color:var(--sun)}
.cbar{width:calc(var(--s)*34px);height:calc(var(--s)*2px);background:rgba(18,15,38,.6);margin-top:calc(var(--s)*1px)}
.cbar i{display:block;height:100%;width:0;background:var(--peach)}
#boards{display:flex;gap:calc(var(--s)*1px);justify-content:flex-end;min-height:calc(var(--s)*7px)}
#boards img{width:calc(var(--s)*14px);height:calc(var(--s)*6px);image-rendering:pixelated}
#mute{position:absolute;right:calc(var(--s)*5px);bottom:calc(var(--s)*4px);pointer-events:auto;cursor:pointer;
  font:inherit;font-size:calc(var(--s)*4px);color:var(--foam);background:rgba(18,15,38,.55);border:0;padding:calc(var(--s)*1px) calc(var(--s)*2px)}
#mute:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--fd);font-size:calc(var(--s)*9px);
  color:var(--sun);text-shadow:calc(var(--s)*.6px) calc(var(--s)*.6px) 0 var(--ink);animation:rise 1.2s steps(12) forwards}
.pop small{display:block;text-align:center;font-family:var(--fu);font-size:calc(var(--s)*4px);color:var(--foam)}
.pop.bad{color:var(--bad)}
.pop.big{font-size:calc(var(--s)*14px);color:var(--foam)}
@keyframes rise{0%{opacity:0;margin-top:0}10%{opacity:1}80%{opacity:1}100%{opacity:0;margin-top:calc(var(--s)*-14px)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:calc(var(--s)*4px);background:linear-gradient(180deg,rgba(18,15,38,.15),rgba(18,15,38,.7));font-size:calc(var(--s)*4.5px);
  text-shadow:calc(var(--s)*.5px) calc(var(--s)*.5px) 0 var(--ink)}
.ov h1{margin:0;font-family:var(--fd);font-weight:400;font-size:calc(var(--s)*34px);line-height:.8;color:var(--foam);
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 var(--sea),calc(var(--s)*2px) calc(var(--s)*2px) 0 var(--ink)}
.ov h2{margin:0;font-family:var(--fd);font-weight:400;font-size:calc(var(--s)*22px);line-height:.9;color:var(--sun)}
.ov p{margin:0;max-width:calc(var(--s)*230px);line-height:1.5}
.ov .keys{color:var(--peach)}
.go{pointer-events:auto;cursor:pointer;font-family:var(--fd);font-size:calc(var(--s)*12px);color:var(--ink);background:var(--sun);
  border:0;padding:calc(var(--s)*1px) calc(var(--s)*10px) calc(var(--s)*2px);box-shadow:0 calc(var(--s)*2px) 0 #c9862f}
.go:active{transform:translateY(calc(var(--s)*1px));box-shadow:0 calc(var(--s)*1px) 0 #c9862f}
#touch{display:none;gap:10px;width:100%;max-width:640px;justify-content:space-between}
#touch .grp{display:flex;gap:10px}
#touch button{width:68px;height:58px;border:0;border-radius:6px;background:var(--dusk);color:var(--foam);font:16px var(--fu);
  box-shadow:0 4px 0 #241c46;touch-action:none}
#touch button.on{background:var(--sea);transform:translateY(2px);box-shadow:0 2px 0 #241c46}
#touch small{display:block;font-size:9px;color:var(--peach)}
@media (pointer:coarse){#touch{display:flex}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:1.6s}}
</style>

</head>
<body>
<div id="stage">
  <canvas id="c" width="320" height="180"></canvas>
  <div id="hud">
    <div class="tl"><div class="lbl">SCORE</div><div id="score">0</div><div id="combo">COMBO <b>x1</b></div><div class="cbar"><i id="cbar"></i></div></div>
    <div class="tr"><div id="boards"></div><div class="lbl">BEST <span id="best">0</span></div></div>
    <button id="mute" type="button">SOUND: ON</button>
  </div>
  <div id="pops"></div>
  <div id="title" class="ov">
    <h1>SWELL RIDER</h1>
    <p>Ride the peeling wave. Stay ahead of the whitewater.</p>
    <p class="keys">UP / DOWN carve the face · LEFT brake · RIGHT pump<br>Hit the lip fast to launch · LEFT / RIGHT to spin in the air</p>
    <button class="go" id="play" type="button">PADDLE OUT</button>
  </div>
  <div id="over" class="ov" hidden>
    <h2 id="overT">WIPED OUT</h2>
    <p id="overP"></p>
    <button class="go" id="again" type="button">PADDLE OUT AGAIN</button>
  </div>
  <div id="paused" class="ov" hidden><h2>PAUSED</h2><p>Press P or tap to keep surfing</p></div>
</div>
<div id="touch">
  <div class="grp"><button data-k="up" type="button">▲<small>CLIMB</small></button><button data-k="down" type="button">▼<small>DROP</small></button></div>
  <div class="grp"><button data-k="left" type="button">◀<small>BRAKE</small></button><button data-k="right" type="button">▶<small>PUMP</small></button></div>
</div>

<script>
'use strict';
// ------------------------------------------------------------------ setup
const W = 320, H = 180, T = 158, HZ = 62;          // T = trough line, HZ = horizon
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
const pk = hex => { const n = parseInt(hex.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | ((n >> 16) & 255)) >>> 0; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16);
const hash = (a, b, c = 0) => { let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };

const COL = {
  sky: ['#231a45', '#3a2a63', '#62427e', '#9a5a86', '#d9787a', '#f4a679', '#ffcf96'].map(pk),
  sun: pk('#fff1c9'), sunEdge: pk('#ffd99a'),
  hill: pk('#4b3a6c'), hillTop: pk('#5d4878'),
  cloud: pk('#f8c3a4'), cloudHi: pk('#ffe2cc'), cloudLo: pk('#d58c8a'),
  sea: ['#3a7690', '#2c6882', '#225b74', '#1b4f68'].map(pk), glint: pk('#ffd9a0'),
  face: ['#0c3f50', '#11566a', '#1b7483', '#2d9497', '#58b8ae', '#9adcc8'].map(pk),
  lip: pk('#effff8'),
  foam: ['#ffffff', '#e2f7f3', '#b5e2e0', '#7fc2c9'].map(pk),
  hollow: ['#06222d', '#0a3240', '#0f4152'].map(pk),
  fg: ['#0d3a4b', '#104254'].map(pk), ripple: pk('#2a7486'), fgFoam: pk('#cfeeea'),
};

// ------------------------------------------------------------------ sprites
function sprite(rows, pal) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
const SURF_PAL = { h: '#3b2416', k: '#e2a06f', s: '#e8523f', b: '#26408f', w: '#fff7e6', r: '#f2a53a' };
const SURFER = sprite([
  '.......hhh......',
  '......hkkkh.....',
  '.......kkk......',
  '....kkssssskk...',
  '...k..ssss...k..',
  '......ssss......',
  '......bbbb......',
  '.....bb..bb.....',
  '....bb....bb....',
  '...kk......kk...',
  '.wwwwwwwwwwwwwww',
  '..rrrrrrrrrrrrr.',
], SURF_PAL);
const TUMBLER = sprite([
  '..hhh...',
  '.hkkkh..',
  '..kkk...',
  'kssssk..',
  '.ssss...',
  '.bbbb...',
  '.b..bk..',
  'kk...k..',
], SURF_PAL);
const BOARD = sprite(['.wwwwwwwwwwwwwww', '..rrrrrrrrrrrrr.'], SURF_PAL);
const ROCK = sprite([
  '....gggg....',
  '..gggGGggg..',
  '.ggGGGGgggg.',
  'gggggggggggd',
  'dgggggggggdd',
  '.dddddddddd.',
], { g: '#5c5874', G: '#8d88a6', d: '#34304a' });
const PADDLER = sprite([
  '..hk..........',
  '.hkkssssbb....',
  '..k..ssss.bkk.',
  'yyyyyyyyyyyyy.',
  '.oooooooooooo.',
], { h: '#e8c45a', k: '#c98b5c', s: '#2f9e6a', b: '#2a2a40', y: '#7fd6e8', o: '#3f7fb0' });
const STAR = sprite([
  '...o...',
  '...o...',
  'ooooooo',
  '.ooOoo.',
  '..ooo..',
  '.oo.oo.',
  'oo...oo',
], { o: '#ff8f3a', O: '#ffd36b' });
const GULL = sprite(['w...w', '.w.w.', '..k..'], { w: '#f4f0ff', k: '#3a2a63' });

// ------------------------------------------------------------------ static sky
const skyBuf = new Uint32Array(W * HZ);
for (let y = 0; y < HZ; y++) for (let x = 0; x < W; x++) {
  const t = y / (HZ - 1) * (COL.sky.length - 1), i0 = Math.floor(t), f = t - i0;
  let c = f > BAYER[(y & 3) * 4 + (x & 3)] ? COL.sky[Math.min(i0 + 1, COL.sky.length - 1)] : COL.sky[i0];
  const dx = x - 244, dy = y - 49, d = Math.sqrt(dx * dx + dy * dy);
  if (d < 15) c = d > 13.6 ? COL.sunEdge : (y > 52 && (y % 3 === 0)) ? COL.sunEdge : COL.sun;
  skyBuf[y * W + x] = c;
}
const hillH = new Float32Array(512);
for (let i = 0; i < 512; i++) {
  const a = i / 512 * Math.PI * 2;
  hillH[i] = Math.max(0, 9 * Math.sin(a * 3 + 0.5) + 5 * Math.sin(a * 7 + 2) + 3 * Math.sin(a * 17) - 3);
}
function makeCloud() {
  const w = (rnd(26, 52)) | 0, h = (rnd(7, 12)) | 0, m = new Uint8Array(w * h);
  const blobs = Array.from({ length: 5 }, () => [rnd(h * 0.6, w - h * 0.6), rnd(h * 0.45, h * 0.8), rnd(h * 0.35, h * 0.6)]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (const [bx, by, r] of blobs) if ((x - bx) ** 2 + ((y - by) * 1.6) ** 2 < r * r) m[y * w + x] = 1;
  return { x: rnd(0, W + 60), y: rnd(6, 38) | 0, w, h, m, sp: rnd(0.5, 1.2) };
}
const clouds = Array.from({ length: 6 }, makeCloud);

// ------------------------------------------------------------------ game state
let G, P, state = 'title', demo = true, paused = false;
let best = 0; try { best = +localStorage.getItem('swellrider.best') || 0; } catch (e) { }
const parts = [];
function resetRun() {
  G = { t: G ? G.t : 0, time: 0, c: 70, scroll: G ? G.scroll : 0, Hmax: 86, score: 0, mult: 1, multT: 0, lives: 3, wave: 1, objs: [], spawnT: 2, curl: 46, gulls: [] };
  spawnSurfer();
}
function spawnSurfer() {
  P = { x: 150, h: 0.55, vh: 0, v: G.c + 6, air: false, ax: 0, ay: 0, vy: 0, ang: 0, spin: 0, airT: 0, state: 'ride', wipeT: 0,
    inv: 1.5, barrel: 0, snapArm: 0, snapCD: 0, bx: 0, by: 0, bvx: 0, bvy: 0, bang: 0, botSpin: 0, botFlip: 0.9 };
}
const waveH = x => { const d = Math.max(0, x - G.curl); return G.Hmax * (0.5 + 0.5 * Math.exp(-d / 140)) * (1 + 0.035 * Math.sin(G.t * 1.3 + x * 0.03)); };
const lipY = x => T - waveH(x);

// ------------------------------------------------------------------ input
const keys = { up: false, down: false, left: false, right: false };
const KEYMAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) { keys[k] = true; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'Enter') { if (state !== 'play') { e.preventDefault(); start(); } }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && state === 'play') setPause(!paused);
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setPause(true); });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); if (paused) setPause(false); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
document.getElementById('paused').addEventListener('pointerdown', () => setPause(false));
function setPause(v) { paused = v; document.getElementById('paused').hidden = !v; }

// ------------------------------------------------------------------ sound
let actx = null, master = null, muted = false;
function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 0.13; lg.gain.value = 260; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const g = actx.createGain(); g.gain.value = 0.16;
    src.connect(lp); lp.connect(g); g.connect(master); src.start();
    actx.noiseBuf = buf;
  } catch (e) { actx = null; }
}
function blip(f1, f2, dur, vol = 0.1, type = 'square') {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function splashSound(vol = 0.5, dur = 0.7) {
  if (!actx || muted) return;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;
  s.buffer = actx.noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON'); if (master) master.gain.value = muted ? 0 : 0.5; };

// ------------------------------------------------------------------ hud
const $ = id => document.getElementById(id);
const popsEl = $('pops');
function popup(text, x, y, cls = '', sub = '') {
  if (demo) return;
  const el = document.createElement('div'); el.className = 'pop ' + cls;
  el.style.left = clamp(x, 40, W - 40) / W * 100 + '%'; el.style.top = clamp(y, 30, H - 10) / H * 100 + '%';
  el.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
  popsEl.appendChild(el); setTimeout(() => el.remove(), 1250);
}
const boardURL = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 6; const g = c.getContext('2d'); g.drawImage(BOARD, 0, 2); return c.toDataURL(); })();
let lastLives = -1, lastScore = -1, lastMult = -1;
function updateHUD() {
  const s = demo ? 0 : Math.floor(G.score);
  if (s !== lastScore) { $('score').textContent = s.toLocaleString('en-US'); lastScore = s; }
  if (G.mult !== lastMult) { $('combo').innerHTML = `COMBO <b>x${G.mult}</b>`; lastMult = G.mult; }
  $('cbar').style.width = (G.mult > 1 ? clamp(G.multT / 6, 0, 1) * 100 : 0) + '%';
  const lv = demo ? 0 : G.lives;
  if (lv !== lastLives) { $('boards').innerHTML = Array.from({ length: lv }, () => `<img src="${boardURL}" alt="board">`).join(''); lastLives = lv; }
  $('best').textContent = Math.floor(best).toLocaleString('en-US');
}

// ------------------------------------------------------------------ scoring
function award(name, pts, bump, x, y) {
  if (demo) return;
  const got = Math.round(pts * G.mult);
  G.score += got;
  if (bump) G.mult = Math.min(8, G.mult + 1);
  G.multT = 6;
  popup(name, x, y, '', '+' + got.toLocaleString('en-US') + (G.mult > 1 ? `  x${G.mult}` : ''));
}
function wipe(reason) {
  if (P.state === 'wipe') return;
  const bx = P.air ? P.ax : P.x, by = P.air ? P.ay : T - P.h * waveH(P.x);
  P.state = 'wipe'; P.wipeT = 1.9; P.ax = bx; P.ay = by - 4; P.vy = -70; P.air = false; P.barrel = 0;
  P.bx = bx; P.by = by; P.bvx = rnd(-30, 40); P.bvy = -110; P.bang = 0;
  for (let i = 0; i < 40; i++) addPart(bx + rnd(-6, 6), by + rnd(-4, 2), rnd(-50, 50), rnd(-110, -20), rnd(0.4, 1), i & 1 ? '#ffffff' : '#bfe8e6');
  splashSound(0.6, 0.9);
  if (demo) return;
  G.mult = 1; G.lives--;
  popup(reason, bx, by - 14, 'bad');
}
function afterWipe() {
  if (demo) { spawnSurfer(); return; }
  if (G.lives <= 0) return gameOver();
  G.wave++; G.objs = [];
  spawnSurfer();
  popup('SET ' + G.wave, W / 2, 80, 'big');
  blip(330, 660, 0.25, 0.06, 'triangle');
}
function gameOver() {
  const s = Math.floor(G.score), nb = s > best;
  if (nb) { best = s; try { localStorage.setItem('swellrider.best', String(s)); } catch (e) { } }
  $('overT').textContent = nb ? 'NEW BEST!' : 'WIPED OUT';
  $('overP').innerHTML = `Score <b style="color:var(--sun)">${s.toLocaleString('en-US')}</b> · ${G.wave} sets · ${Math.round(G.time)}s on the wave` + (nb ? '' : `<br>Best ${Math.floor(best).toLocaleString('en-US')}`);
  $('over').hidden = false; state = 'over'; demo = true; spawnSurfer();
}
function start() {
  initAudio(); if (actx && actx.state === 'suspended') actx.resume();
  $('title').hidden = true; $('over').hidden = true; setPause(false);
  demo = false; state = 'play'; resetRun(); popsEl.innerHTML = '';
  popup('SET 1', W / 2, 80, 'big');
  lastLives = -1; lastMult = -1;
}
$('play').onclick = start; $('again').onclick = start;

// ------------------------------------------------------------------ particles
function addPart(x, y, vx, vy, life, col) { if (parts.length < 600) parts.push({ x, y, vx, vy, life, max: life, col }); }

// ------------------------------------------------------------------ bot (title screen + game over backdrop)
function botInput() {
  const k = { up: false, down: false, left: false, right: false };
  if (P.state !== 'ride') return k;
  const d = P.x - G.curl;
  if (P.air) { if (Math.abs(P.spin) < P.botSpin) k.right = true; return k; }
  if (P.h > P.botFlip) P.botDir = -1;
  if (P.h < 0.32 || P.botDir === undefined) { P.botDir = 1; P.botFlip = Math.random() < 0.35 ? 1.1 : rnd(0.78, 0.92); }
  k.up = P.botDir > 0; k.down = P.botDir < 0;
  if (d > 140) k.left = true;
  if (d < 75) k.right = true;
  for (const o of G.objs) if (o.type !== 'star' && o.x - P.x > 0 && o.x - P.x < 40 && Math.abs(o.h - P.h) < 0.25) { k.up = o.h < P.h + 0.05; k.down = !k.up; }
  return k;
}

// ------------------------------------------------------------------ update
function update(dt) {
  G.t += dt;
  G.curl = 46 + 8 * Math.sin(G.t * 0.45);
  const live = state === 'play' && !paused;
  if (!live && !demo) return;
  G.time += dt;
  G.c = demo ? 72 : Math.min(112, 70 + G.time * 0.45);
  G.scroll += G.c * dt;
  const inp = demo ? botInput() : keys;
  updatePlayer(dt, inp);
  updateObjs(dt);
  if (!demo) {
    G.multT -= dt; if (G.multT <= 0 && G.mult > 1) { G.mult = 1; }
    if (P.state === 'ride') G.score += G.c * dt * 0.2;
  }
  for (const c of clouds) { c.x -= (G.c * 0.03 + 2) * c.sp * dt; if (c.x < -c.w - 4) { Object.assign(c, makeCloud()); c.x = W + rnd(0, 40); } }
  if (Math.random() < dt * 0.15 && G.gulls.length < 3) G.gulls.push({ x: W + 4, y: rnd(14, 44), sp: rnd(14, 26), ph: rnd(0, 6) });
  for (const g of G.gulls) g.x -= g.sp * dt;
  G.gulls = G.gulls.filter(g => g.x > -8);
  // curl spray
  const cl = lipY(G.curl);
  for (let i = 0; i < 2; i++) addPart(G.curl + rnd(-2, 8), cl + rnd(-2, 6), rnd(-25, 15), rnd(-45, -5), rnd(0.3, 0.7), Math.random() < 0.7 ? '#ffffff' : '#d4f2ee');
  for (const p of parts) { p.life -= dt; p.vy += 160 * dt; p.x += (p.vx - G.c * 0.15) * dt; p.y += p.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0 || parts[i].y > H) parts.splice(i, 1);
}
function updatePlayer(dt, k) {
  if (P.state === 'wipe') {
    P.wipeT -= dt; P.ang += 640 * dt; P.vy += 220 * dt; P.ay = Math.min(P.ay + P.vy * dt, T - 2); P.ax -= G.c * 0.55 * dt;
    P.bvy += 260 * dt; P.bx += (P.bvx - G.c * 0.4) * dt; P.by = Math.min(P.by + P.bvy * dt, T); P.bang += 500 * dt;
    if (P.wipeT <= 0) afterWipe();
    return;
  }
  P.inv = Math.max(0, P.inv - dt); P.snapCD -= dt;
  if (P.air) {
    P.airT += dt;
    P.ax += (P.v - G.c) * dt; P.v -= P.v * 0.05 * dt;
    P.vy += 330 * dt; P.ay += P.vy * dt;
    const s = (k.right ? 1 : 0) - (k.left ? 1 : 0);
    if (s) { P.ang += s * 640 * dt; P.spin += s * 640 * dt; }
    if (P.ax > 312) P.ax = 312;
    if (P.ax < G.curl + 6) return wipe('SWALLOWED!');
    const L = lipY(P.ax);
    if (P.vy > 0 && P.ay >= L) land(L);
    return;
  }
  // carving on the face
  let acc = k.up ? 3.4 : k.down ? -3.4 : -1.1;
  P.vh = clamp(P.vh + acc * dt, -1.7, 1.7);
  const Hx = waveH(P.x), dh = P.vh * dt;
  P.h += dh;
  if (dh < 0) P.v += -dh * Hx * 1.0; else P.v -= dh * Hx * 0.7;
  const steep = Math.pow(Math.sin(Math.PI * clamp(P.h, 0, 1)), 0.7);
  P.v += 30 * steep * (Hx / G.Hmax) * (k.right ? 1.35 : 1) * dt;
  if (k.left) P.v -= 80 * dt;
  P.v -= (P.v * 0.17 + (P.h < 0.1 ? 45 : 0)) * dt;
  P.v = clamp(P.v, 25, 200);
  if (P.h <= 0) { P.h = 0; if (P.vh < 0) P.vh = 0; }
  if (P.h >= 1) {
    if (P.vh > 0.85) { launch(Hx); return; }
    P.h = 1; P.vh = Math.min(P.vh, 0);
  }
  P.x += (P.v - G.c) * dt;
  if (P.x > 312) { P.x = 312; P.v = Math.min(P.v, G.c + 4); }
  if (P.x < G.curl + 8) return wipe('CAUGHT INSIDE!');
  // snap: hard turn off the top
  if (P.h > 0.8 && P.vh > 0.45) P.snapArm = 0.35;
  P.snapArm -= dt;
  if (P.snapArm > 0 && P.vh < -0.35 && P.snapCD <= 0) {
    P.snapCD = 1; P.snapArm = 0;
    const by = T - P.h * Hx;
    for (let i = 0; i < 14; i++) addPart(P.x - 4 + rnd(-3, 3), by - 2, rnd(-70, -10), rnd(-90, -30), rnd(0.3, 0.6), '#ffffff');
    award('SNAP', 60, false, P.x, by - 14); blip(500, 900, 0.08, 0.05);
  }
  // barrel
  const inB = P.x - G.curl < 40 && P.h > 0.2 && P.h < 0.85;
  if (inB) P.barrel += dt;
  else if (P.barrel > 0) {
    if (P.barrel > 0.5) { award('BARREL', Math.round(P.barrel * 320), true, P.x, T - P.h * Hx - 14); blip(400, 1200, 0.3, 0.07, 'triangle'); }
    P.barrel = 0;
  }
  // board spray
  if (Math.abs(P.vh) > 0.45 || P.v > G.c + 25) {
    const by = T - P.h * Hx;
    addPart(P.x - 6, by - 1, -(P.v - G.c) * 0.4 - rnd(10, 40), rnd(-50, -5) * (P.vh < 0 ? 1.4 : 0.7), rnd(0.2, 0.45), Math.random() < 0.6 ? '#ffffff' : '#bfe8e6');
  }
}
function launch(Hx) {
  P.air = true; P.ax = P.x; P.ay = lipY(P.x); P.vy = -P.vh * Hx * 1.15; P.ang = -P.vh * 18; P.spin = 0; P.airT = 0;
  P.botSpin = P.vy < -105 ? 360 : 0; P.snapArm = 0;
  for (let i = 0; i < 16; i++) addPart(P.ax + rnd(-5, 5), P.ay, rnd(-40, 30), rnd(-110, -40), rnd(0.3, 0.7), '#ffffff');
  blip(220, 520, 0.18, 0.05, 'triangle');
}
function land(L) {
  const a = ((P.ang % 360) + 540) % 360 - 180;
  if (Math.abs(a) > 55) { P.ay = L; return wipe(Math.abs(P.spin) > 180 ? 'OVER-ROTATED!' : 'BAD LANDING!'); }
  P.air = false; P.x = P.ax; P.h = 0.96;
  const Hx = waveH(P.x);
  P.vh = -clamp(P.vy / Hx, 0.4, 1.7); P.v += 12; P.ang = 0; P.snapArm = 0; P.snapCD = 0.6;
  const rot = Math.round(Math.abs(P.spin) / 360);
  const name = rot === 0 ? 'AIR' : rot === 1 ? 'AIR 360' : rot === 2 ? 'ALLEY-OOP 720' : `${rot * 360} RODEO`;
  award(name, 150 + rot * 450 + Math.round(P.airT * 120), true, P.x, L - 16);
  for (let i = 0; i < 18; i++) addPart(P.x + rnd(-6, 6), L, rnd(-60, 30), rnd(-80, -20), rnd(0.3, 0.6), '#ffffff');
  blip(660, 990 + rot * 200, 0.15, 0.06); splashSound(0.15, 0.3);
}
function updateObjs(dt) {
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    G.spawnT = rnd(1.3, 2.5) * Math.max(0.55, 1 - G.time / 240);
    const r = Math.random(); let o;
    if (r < 0.32) o = { type: 'rock', h: rnd(0.0, 0.1) };
    else if (r < 0.62) o = { type: 'paddler', h: rnd(0.3, 0.7) };
    else o = { type: 'star', h: Math.random() < 0.35 ? rnd(1.25, 1.55) : rnd(0.2, 0.92) };
    o.x = W + 12; o.ph = rnd(0, 6); G.objs.push(o);
  }
  const ride = P.state === 'ride';
  const ppx = P.air ? P.ax : P.x, ppy = (P.air ? P.ay : T - P.h * waveH(P.x)) - 5;
  for (const o of G.objs) {
    o.x -= G.c * (o.type === 'paddler' ? 0.85 : 1) * dt;
    const oy = objY(o);
    if (!ride || o.dead) continue;
    if (Math.abs(o.x - ppx) < 8 && Math.abs(oy - 2 - ppy) < 9) {
      if (o.type === 'star') {
        o.dead = true; award('STARFISH', 150, false, o.x, oy - 8); blip(880, 1760, 0.12, 0.05);
        for (let i = 0; i < 10; i++) addPart(o.x, oy, rnd(-40, 40), rnd(-60, 0), rnd(0.3, 0.6), '#ffd36b');
      } else if (!P.air && P.inv <= 0) { o.dead = true; wipe(o.type === 'rock' ? 'HIT A ROCK!' : 'DROPPED IN ON!'); }
    }
  }
  G.objs = G.objs.filter(o => !o.dead && o.x > G.curl - 4);
}
function objY(o) { return o.h > 1 ? lipY(o.x) - (o.h - 1) * 60 + Math.sin(G.t * 3 + o.ph) * 2 : T - o.h * waveH(o.x); }

// ------------------------------------------------------------------ render
function render() {
  const cx = Math.round(G.curl), frame = (G.t * 30) | 0, sc = G.scroll | 0;
  px.set(skyBuf, 0);
  // far headland
  const ho = (G.scroll * 0.06) | 0;
  for (let x = 0; x < W; x++) { const h = hillH[(x + ho) & 511] | 0; for (let y = HZ - h; y < HZ; y++) px[y * W + x] = y === HZ - h ? COL.hillTop : COL.hill; }
  // clouds
  for (const c of clouds) {
    const ox = c.x | 0;
    for (let y = 0; y < c.h; y++) for (let x = 0; x < c.w; x++) {
      if (!c.m[y * c.w + x]) continue;
      const sx = ox + x; if (sx < 0 || sx >= W) continue;
      const top = y === 0 || !c.m[(y - 1) * c.w + x], bot = y === c.h - 1 || !c.m[(y + 1) * c.w + x];
      px[(c.y + y) * W + sx] = top ? COL.cloudHi : bot ? COL.cloudLo : COL.cloud;
    }
  }
  // open ocean behind the wave
  for (let y = HZ; y < T; y++) {
    const t = (y - HZ) / (T - HZ) * (COL.sea.length - 1), i0 = Math.floor(t), f = t - i0;
    for (let x = 0; x < W; x++) {
      let c = f > BAYER[(y & 3) * 4 + (x & 3)] ? COL.sea[Math.min(i0 + 1, 3)] : COL.sea[i0];
      const spread = 6 + (y - HZ) * 0.5;
      if (Math.abs(x - 244) < spread && (hash((x + sc) >> 2, y, frame >> 3) & 7) === 0) c = COL.glint;
      px[y * W + x] = c;
    }
  }
  // the wave
  const hc = waveH(cx);
  for (let x = 0; x < W; x++) {
    if (x < cx - 2) {
      // whitewater
      const top = (T - hc * (0.45 + 0.4 * (x / cx)) + 3 * Math.sin(x * 0.27 + G.t * 7) + (hash(x, frame >> 1) & 3)) | 0;
      for (let y = Math.max(HZ, top); y < T; y++) {
        const r = hash(x, y, frame) & 15;
        px[y * W + x] = COL.foam[r < 7 ? 0 : r < 11 ? 1 : r < 14 ? 2 : 3];
      }
      continue;
    }
    const Hx = waveH(x), L = (T - Hx) | 0, dx = x - cx;
    const depth = dx < 44 ? Hx * 0.62 * Math.pow(1 - dx / 44, 1.2) : 0;
    for (let y = L; y < T; y++) {
      let c;
      if (y < L + 2 || (y === L + 2 && (hash(x, frame >> 2) & 1))) c = COL.lip;
      else if (depth && y < L + 3 + depth) {
        const k = (y - L) / (depth + 3);
        c = COL.hollow[k < 0.35 ? 0 : k < 0.75 ? 1 : 2];
        if (y > L + depth && (hash(x, y, frame) & 3) === 0) c = COL.face[3];
      } else {
        let f = (T - y) / Hx + (BAYER[(y & 3) * 4 + (x & 3)] - 0.5) * 0.06;
        let i = f < 0.12 ? 0 : f < 0.28 ? 1 : f < 0.48 ? 2 : f < 0.68 ? 3 : f < 0.86 ? 4 : 5;
        if (i < 5 && f > 0.15 && (hash((x + sc) >> 2, y, 7) & 63) === 0) i++;
        c = COL.face[i];
      }
      px[y * W + x] = c;
    }
  }
  // foreground shallows
  for (let y = T; y < H; y++) for (let x = 0; x < W; x++) {
    let c = COL.fg[(y >> 1) & 1];
    if ((hash((x + ((sc * 1.3) | 0)) >> 3, y, 3) & 7) === 0) c = COL.ripple;
    if (y < T + 2 && x >= cx - 2 && (hash(x >> 1, y, frame >> 2) & 3) !== 0) c = COL.fgFoam;
    px[y * W + x] = c;
  }
  ctx.putImageData(img, 0, 0);

  // gulls
  for (const g of G.gulls) ctx.drawImage(GULL, g.x | 0, (g.y + Math.sin(G.t * 4 + g.ph) * 1.5) | 0);
  // objects
  for (const o of G.objs) {
    const oy = objY(o) | 0, ox = o.x | 0;
    if (o.type === 'rock') {
      ctx.drawImage(ROCK, ox - 6, oy - 5);
      ctx.fillStyle = '#e2f7f3'; for (let i = 0; i < 4; i++) ctx.fillRect(ox - 7 + ((i * 5 + frame) % 15), oy, 2, 1);
    } else if (o.type === 'paddler') ctx.drawImage(PADDLER, ox - 7, oy - 4);
    else { if ((frame >> 2) % 6) ctx.drawImage(STAR, ox - 3, oy - 6); else { ctx.fillStyle = '#fff'; ctx.fillRect(ox, oy - 6, 1, 7); ctx.fillRect(ox - 3, oy - 3, 7, 1); } }
  }
  // surfer
  drawSurfer();
  // the lip curls over a surfer in the tube
  for (let x = cx - 3; x < cx + 44; x++) {
    if (x < 0) continue;
    const L = lipY(x) | 0;
    ctx.fillStyle = '#effff8'; ctx.fillRect(x, L, 1, 2);
    if (x <= cx + 1) {
      for (let y = L + 2; y < T; y += 1) { const r = hash(x, y, frame) & 7; ctx.fillStyle = r < 4 ? '#ffffff' : r < 6 ? '#d9f2ee' : '#9fd6d6'; ctx.fillRect(x, y, 1, 1); }
    }
  }
  // particles
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x | 0, p.y | 0, 1, 1); }
  ctx.globalAlpha = 1;
}
function drawSurfer() {
  if (P.state === 'wipe') {
    ctx.save(); ctx.translate(P.bx | 0, P.by | 0); ctx.rotate(P.bang * Math.PI / 180); ctx.drawImage(BOARD, -8, -1); ctx.restore();
    if (P.ay < T - 3) { ctx.save(); ctx.translate(P.ax | 0, P.ay | 0); ctx.rotate(P.ang * Math.PI / 180); ctx.drawImage(TUMBLER, -4, -4); ctx.restore(); }
    return;
  }
  if (P.inv > 0 && !demo && ((G.t * 12) | 0) % 2) return;
  let x, y, a;
  if (P.air) { x = P.ax; y = P.ay; a = P.ang; }
  else { x = P.x; y = T - P.h * waveH(P.x); a = clamp(-P.vh * 18, -28, 28); }
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(a * Math.PI / 180); ctx.drawImage(SURFER, -8, -11); ctx.restore();
}

// ------------------------------------------------------------------ layout + loop
const stage = $('stage'), touch = $('touch');
function fit() {
  const th = getComputedStyle(touch).display === 'none' ? 0 : touch.offsetHeight + 10;
  const aw = Math.min(innerWidth - 32, 1600), ah = innerHeight - th - 24;
  let s = Math.max(0.5, Math.min(aw / W, ah / H));
  if (s >= 2) s = Math.floor(s);
  stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px'; stage.style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();
document.fonts && document.fonts.ready.then(fit);

resetRun();
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  render(); updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__swell = { get G() { return G; }, get P() { return P; }, update, keys, start, botInput };
</script>
